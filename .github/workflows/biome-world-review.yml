name: Biome world release review
on:
  pull_request:
    paths:
      - 'src/components/three/environment/**'
      - 'src/components/three/environmentArt/**'
      - 'src/components/three/artDirection/**'
      - 'scripts/review-biome-world.mjs'
      - 'scripts/biome-review-contract.mjs'
      - 'scripts/fixtures/biome-review*'
      - 'tests/biome-review-contract.test.mjs'
      - '.github/workflows/biome-world-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: biome-world-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full checks, production entry, biome shaders and settings
        env:
          REVIEW_ANGLE: swiftshader
          REVIEW_OUT: /tmp/slipper-biome-review
        run: node scripts/review-biome-world.mjs
      - name: Retain diagnostics even when rendering fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biome-world-review-${{ github.sha }}
          path: |
            /tmp/slipper-biome-review/**/review.json
            /tmp/slipper-biome-review/**/*.log
            /tmp/slipper-biome-review/**/*.png
            /tmp/slipper-biome-review/**/*.html.txt
          if-no-files-found: warn
          retention-days: 7
