name: Visual presentation review
on:
  pull_request:
    paths:
      - 'src/components/three/environment/**'
      - 'src/components/three/chapters/BrokenFloorChapter.tsx'
      - 'src/components/three/chapters/BlueMoonSanctuaryChapter.tsx'
      - 'src/components/three/chapters/ThornedHouseChapter.tsx'
      - 'src/components/three/cinematics/**'
      - 'tests/environment-presentation.test.mjs'
      - 'scripts/review-environment-presentation.mjs'
      - 'src/visualPresentation.css'
      - 'src/main.tsx'
      - 'src/components/three/storyEvents/**'
      - 'tests/visual-presentation.test.mjs'
      - 'scripts/review-visual-presentation.mjs'
      - '.github/workflows/visual-presentation.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/three/environment/**'
      - 'src/components/three/chapters/BrokenFloorChapter.tsx'
      - 'src/components/three/chapters/BlueMoonSanctuaryChapter.tsx'
      - 'src/components/three/chapters/ThornedHouseChapter.tsx'
      - 'src/components/three/cinematics/**'
      - 'tests/environment-presentation.test.mjs'
      - 'scripts/review-environment-presentation.mjs'
      - 'src/visualPresentation.css'
      - 'src/main.tsx'
      - 'src/components/three/storyEvents/**'
      - 'tests/visual-presentation.test.mjs'
      - 'scripts/review-visual-presentation.mjs'
      - '.github/workflows/visual-presentation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-presentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Check presentation geometry and unchanged application contracts
        run: |
          node --experimental-strip-types --test tests/visual-presentation.test.mjs
          npm run check
      - name: Retain the exact reviewed source and production build
        run: git archive --format=tar.gz HEAD -o /tmp/visual-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: visual-source-and-build
          path: |
            /tmp/visual-source.tar.gz
            dist
          retention-days: 7
      - run: npx playwright install --with-deps chromium
      - name: Capture real entry controls and isolated production components
        run: node scripts/review-visual-presentation.mjs
      - name: Compare chapter atmosphere at low and high quality
        run: node scripts/review-environment-presentation.mjs
      - name: Retain environment comparisons and budgets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-presentation-evidence
          path: /tmp/slipper-environment-review
          if-no-files-found: warn
          retention-days: 7
      - name: Retain screenshots, measurements, and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-presentation-evidence
          path: /tmp/slipper-visual-review
          if-no-files-found: warn
          retention-days: 7
