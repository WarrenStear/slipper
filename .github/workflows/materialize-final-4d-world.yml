name: Materialize final 4D world

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/materialize-final-4d-world.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install final world source
        run: |
          npm run final:world
          npm run content:qa
          npm run world:compile
      - name: Validate final world build
        run: npm run build
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/materialize-final-4d-world.yml
      - name: Commit materialized final world
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/three/StoryScene.tsx src/components/three/chapterDirector.ts src/data/worldState.json docs/FINAL_4D_WORLD.md package.json scripts/build-final-4d-world.mjs .github/workflows/materialize-final-4d-world.yml
          if git diff --cached --quiet; then
            echo "Final 4D world source already materialized."
          else
            git commit -m "build(world): materialize final master 4D world"
            git push
          fi
